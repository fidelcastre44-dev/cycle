name: Déployer le serveur de notifications

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compte Cloudflare (optionnel)
        env:
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: if [ -n "$ACC" ]; then echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> "$GITHUB_ENV"; fi
      - run: npm install
      - name: Déployer
        id: deploy
        run: |
          npx wrangler deploy | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Clé de notification
        run: printf '%s' "${{ secrets.VAPID_PRIVATE_JWK }}" | npx wrangler secret put VAPID_PRIVATE_JWK
      - name: Publier l'adresse du serveur pour l'appli
        working-directory: .
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          [ -z "$URL" ] && exit 0
          printf '{ "url": "%s" }\n' "$URL" > push-server.json
          if ! git diff --quiet push-server.json; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add push-server.json
            git commit -m "Adresse du serveur de notifications"
            git push
          fi
